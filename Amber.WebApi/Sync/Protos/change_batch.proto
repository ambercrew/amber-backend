syntax = "proto3";

package generated_code;

option csharp_namespace = "Amber.WebApi.Sync.Protos";

message CellChange {
  string tbl = 1;
  string row_id = 2;
  string col = 3;
  optional bytes value = 4;
  string hlc = 5;
  string device_id = 6;
}

message ChangeBatch {
  repeated CellChange cells = 1;
}
