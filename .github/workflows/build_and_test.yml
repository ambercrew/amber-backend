name: Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
    - uses: actions/checkout@v6
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal --collect:"XPlat Code Coverage"

    # Merges the Cobertura files.
    - name: ReportGenerator
      uses: danielpalme/ReportGenerator-GitHub-Action@5.5.7
      with:
        reports: '*/TestResults/*/coverage.cobertura.xml'
        targetdir: 'TestResults'
        reporttypes: 'Cobertura'
        classfilters: '-*Dto;-*Exception;-*GeneratedFiles*'
        filefilters: '-*RegexGenerator*;-*/Migrations/*'
        verbosity: 'Info'

    - name: Code Coverage Summary Report
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: ./TestResults/Cobertura.xml
        badge: true
        fail_below_min: true
        format: markdown
        hide_branch_rate: false
        hide_complexity: true
        indicators: true
        output: both
        thresholds: '60 85'

    - name: Add Coverage PR Comment
      uses: marocchino/sticky-pull-request-comment@v2
      if: github.event_name == 'pull_request'
      with:
        recreate: true
        path: code-coverage-results.md

