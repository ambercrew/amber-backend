<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amber: Account Deleted</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #faf8f4;
            color: #2a251f;
        }

        .email-container {
            max-width: 600px;
            margin: 40px auto;
            background-color: #ffffff;
            border: 1px solid #d9d3c5;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 18px rgba(205, 127, 5, 0.08);
        }

        .header {
            background-color: #cd7f05;
            padding: 36px 30px;
            text-align: center;
            color: #ffffff;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .content {
            padding: 40px 30px;
            text-align: center;
            background-color: #ffffff;
        }

        .content p {
            color: #736c5e;
            font-size: 16px;
            line-height: 1.7;
            margin: 0 0 28px;
        }

        .footer {
            padding: 24px 30px;
            text-align: center;
            color: #736c5e;
            font-size: 12px;
            background-color: #faf8f4;
            border-top: 1px solid #d9d3c5;
        }

        .footer p {
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="email-container">
        <div class="header">
            <h1>Account Deleted</h1>
        </div>

        <div class="content">
            <p>Hi {FirstName},</p>

            <p>Your Amber account has been deleted.</p>

            <p>If you'd like to continue using Amber, you're welcome to create a new account at any time.</p>

            <p>We're sorry to see you go.</p>
        </div>

        <div class="footer">
            <p>This is an automated message. Please do not reply to this email.</p>
        </div>
    </div>
</body>
</html>
