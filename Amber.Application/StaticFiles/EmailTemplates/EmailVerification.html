<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amber: Email Verification Code</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #faf8f4;
            color: #2a251f;
        }
        .email-container {
            max-width: 600px;
            margin: 40px auto;
            background-color: #ffffff;
            border: 1px solid #d9d3c5;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 18px rgba(205, 127, 5, 0.08);
        }
        .header {
            background-color: #cd7f05;
            padding: 36px 30px;
            text-align: center;
            color: #ffffff;
        }
        .header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }
        .content {
            padding: 40px 30px;
            text-align: center;
            background-color: #ffffff;
        }
        .content p {
            color: #736c5e;
            font-size: 16px;
            line-height: 1.7;
            margin: 0 0 28px;
        }
        .verification-code {
            background-color: #faf8f4;
            border: 2px dashed #cd7f05;
            border-radius: 12px;
            padding: 24px 32px;
            margin: 32px 0;
            display: inline-block;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.04);
        }
        .code {
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 6px;
            color: #a86107;
            font-family: 'Courier New', monospace;
            line-height: 1;
        }
        .footer {
            padding: 24px 30px;
            text-align: center;
            color: #736c5e;
            font-size: 12px;
            background-color: #faf8f4;
            border-top: 1px solid #d9d3c5;
        }
        .footer p {
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="email-container">
        <div class="header">
            <h1>Email Verification Code</h1>
        </div>

        <div class="content">
            <p>Thank you for signing up! Please use the verification code below to complete your registration.</p>

            <div class="verification-code">
                <div class="code">{VerificationCode}</div>
            </div>

            <p>If you didn't request this code, please ignore this email.</p>
        </div>

        <div class="footer">
            <p>This is an automated message. Please do not reply to this email.</p>
        </div>
    </div>
</body>
</html>
